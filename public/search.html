<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Browse Items — NIE-Vault</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
  .filter-bar {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(16px) saturate(160%);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
    position: sticky; top: 64px; z-index: 100;
  }
  @media(max-width:768px){ .filter-bar { top: 56px; padding: 0.8rem 1rem; } }

  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .filter-label { font-size: 0.7rem; font-weight: 700; color: var(--ink-40); text-transform: uppercase; letter-spacing: 0.07em; }
  .filter-group .form-control { min-width: 130px; padding: 8px 12px; font-size: 0.85rem; border-radius: var(--r-md); }
  .filter-group .form-control[type="text"] { min-width: 180px; }
  .suggestion-group { position: relative; }
  .suggestion-panel {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    width: min(340px, 82vw);
    max-height: 280px;
    overflow-y: auto;
    background: rgba(255,255,255,0.98);
    border: 1px solid var(--border-md);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-lg);
    padding: 6px;
    z-index: 250;
    display: none;
  }
  .suggestion-panel.open { display: block; }
  .suggestion-item {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border: none;
    background: transparent;
    color: var(--ink);
    padding: 10px 12px;
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    transition: background var(--t-fast) var(--ease);
  }
  .suggestion-item:hover,
  .suggestion-item.active { background: var(--ink-10); }
  .suggestion-item-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .suggestion-label { font-size: 0.9rem; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .suggestion-meta { font-size: 0.72rem; color: var(--ink-40); text-transform: uppercase; letter-spacing: 0.06em; }

  .type-pills { display: flex; gap: 6px; align-self: flex-end; }
  .type-pill {
    padding: 8px 16px; border-radius: var(--r-full); font-size: 0.82rem; font-weight: 600;
    border: 1.5px solid var(--border-md); background: none; color: var(--ink-40);
    cursor: pointer; transition: all var(--t-fast) var(--ease);
  }
  .type-pill:hover { border-color: var(--ink-40); color: var(--ink); }
  .type-pill.p-all   { border-color: var(--ink);   background: var(--ink);         color: #fff; }
  .type-pill.p-lost  { border-color: var(--amber);  background: var(--amber-light); color: var(--amber-dark); }
  .type-pill.p-found { border-color: var(--jade);   background: var(--jade-light);  color: var(--jade-dark); }

  .filter-actions { display: flex; gap: 8px; align-self: flex-end; }

  main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

  .results-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.2rem;
  }
  .results-count { font-size: 0.85rem; color: var(--ink-40); font-weight: 500; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(275px, 1fr)); gap: 1.2rem; }

  /* Skeleton loading cards */
  .skel-card { border-radius: var(--r-xl); overflow: hidden; }
  .skel-img  { height: 160px; }
  .skel-body { padding: 1rem; display: flex; flex-direction: column; gap: 8px; }
  .skel-line { height: 14px; border-radius: 6px; }
  .skel-line.short { width: 55%; }
</style>
</head>
<body>

<nav class="navbar" id="navbar">
  <a class="navbar-brand" href="/home.html">
    <div class="logo-mark">🔍</div>
    NIE-Vault
  </a>
  <div class="navbar-nav">
    <a class="nav-item" data-page="home"   href="/home.html">Home</a>
    <a class="nav-item" data-page="search" href="/search.html">Browse Items</a>
    <a class="nav-item" href="/report.html?type=lost">Report Lost</a>
    <a class="nav-item" href="/report.html?type=found">Report Found</a>
  </div>
  <div class="navbar-actions">
    <span style="font-size:0.85rem;color:var(--ink-40);">Hi, <strong id="nav-user">…</strong></span>
    <button class="btn btn-ghost btn-sm" id="nav-logout">Sign Out</button>
  </div>
</nav>

<!-- Filter bar -->
<div class="filter-bar">
  <div class="type-pills">
    <button class="type-pill p-all"   id="pillAll"   onclick="setType('')">All</button>
    <button class="type-pill"         id="pillLost"  onclick="setType('lost')">😟 Lost</button>
    <button class="type-pill"         id="pillFound" onclick="setType('found')">🎉 Found</button>
  </div>
  <div class="filter-group suggestion-group">
    <div class="filter-label">Keyword</div>
    <input class="form-control" type="text" id="fKeyword" placeholder="Search…"/>
    <div class="suggestion-panel" id="suggestionPanel" aria-label="Search suggestions"></div>
  </div>
  <div class="filter-group">
    <div class="filter-label">Category</div>
    <select class="form-control" id="fCategory">
      <option value="">All categories</option>
    </select>
  </div>
  <div class="filter-group">
    <div class="filter-label">Color</div>
    <input class="form-control" type="text" id="fColor" placeholder="Black, Red…"/>
  </div>
  <div class="filter-group">
    <div class="filter-label">Location</div>
    <input class="form-control" type="text" id="fLocation" placeholder="Canteen, Library…"/>
  </div>
  <div class="filter-actions">
    <button class="btn btn-primary btn-sm" onclick="doSearch()">Search</button>
    <button class="btn btn-ghost btn-sm"   onclick="clearAll()">Clear</button>
  </div>
</div>

<main>
  <div class="results-header">
    <div class="results-count" id="resultCount"></div>
    <a class="btn btn-sky btn-sm" href="/report.html">+ Report Item</a>
  </div>
  <div class="grid" id="grid">
    <!-- skeleton -->
    ${[1,2,3,4,5,6].map(() => `
    <div class="skel-card">
      <div class="skeleton skel-img"></div>
      <div class="skel-body">
        <div class="skeleton skel-line short"></div>
        <div class="skeleton skel-line"></div>
        <div class="skeleton skel-line short"></div>
      </div>
    </div>`).join('')}
  </div>
  <div style="display:flex;justify-content:center;margin-top:18px;">
    <div id="pagination" style="display:flex;gap:8px;align-items:center;"></div>
  </div>
</main>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="js/app.js"></script>
<script src="js/notifications.js"></script>
<script src="js/search.js"></script>
</body>
</html>
