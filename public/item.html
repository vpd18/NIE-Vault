<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Item Detail — NIE-Vault</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
  main { max-width: 780px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }

  .breadcrumb {
    font-size: 0.8rem; color: var(--ink-40); margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: 6px;
  }
  .breadcrumb a { color: var(--sky); text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }

  .detail-card { background: var(--surface); border-radius: var(--r-2xl); border: 1px solid var(--border); overflow: hidden; margin-bottom: 1.2rem; box-shadow: var(--shadow-sm); }

  .detail-img { width: 100%; max-height: 340px; object-fit: cover; display: block; }
  .detail-img-placeholder {
    width: 100%; height: 220px;
    display: flex; align-items: center; justify-content: center;
    font-size: 4.5rem;
  }
  .detail-img-placeholder.lost  { background: linear-gradient(135deg,#fffbeb,#fef3c7); }
  .detail-img-placeholder.found { background: linear-gradient(135deg,#ecfdf5,#d1fae5); }

  .detail-body { padding: 1.8rem; }

  .detail-top { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 1rem; }
  .detail-badges { display: flex; align-items: center; gap: 8px; }

  .detail-title { font-size: 1.7rem; margin-bottom: 0.4rem; }

  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 1.4rem 0; }
  @media(max-width: 500px){ .meta-grid { grid-template-columns: 1fr; } }

  .meta-item { background: var(--canvas); border-radius: var(--r-md); padding: 0.85rem 1rem; }
  .meta-item .mk { font-size: 0.72rem; font-weight: 700; color: var(--ink-40); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
  .meta-item .mv { font-size: 0.92rem; font-weight: 500; color: var(--ink); }

  .desc-section { margin-top: 1.2rem; }
  .desc-section .ds-label { font-size: 0.78rem; font-weight: 700; color: var(--ink-40); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .desc-section .ds-text  { color: var(--ink-80); line-height: 1.75; font-size: 0.95rem; }

  .section-card { background: var(--surface); border-radius: var(--r-xl); border: 1px solid var(--border); padding: 1.5rem 1.6rem; margin-bottom: 1.2rem; box-shadow: var(--shadow-xs); }
  .section-card-title { font-family: 'Clash Display', sans-serif; font-size: 0.95rem; font-weight: 600; color: var(--ink); margin-bottom: 1.2rem; display: flex; align-items: center; gap: 8px; }

  /* Claim form */
  .claim-btn { width: 100%; padding: 13px; margin-top: 1rem; font-size: 0.95rem; border-radius: var(--r-full); }

  /* Claims list */
  .claim-item { border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 0.8rem; }
  .claim-header { padding: 0.9rem 1.1rem; background: var(--canvas); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .claim-name   { font-weight: 600; font-size: 0.92rem; }
  .claim-body   { padding: 0.9rem 1.1rem; }
  .claim-msg    { font-size: 0.85rem; color: var(--ink-40); margin-bottom: 0.8rem; font-style: italic; }
  .claim-actions{ display: flex; gap: 8px; flex-wrap: wrap; }

  /* Message thread */
  .msg-thread { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; padding: 4px 0; margin-bottom: 10px; }
  .bubble { max-width: 78%; padding: 9px 14px; border-radius: 16px; font-size: 0.88rem; line-height: 1.55; }
  .bubble.me   { background: var(--ink); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .bubble.them { background: var(--ink-10); color: var(--ink); align-self: flex-start; border-bottom-left-radius: 4px; }
  .bubble .bw  { font-size: 0.7rem; opacity: 0.6; margin-bottom: 2px; font-weight: 600; }
  .send-row    { display: flex; gap: 8px; }
  .send-row textarea { min-height: 40px; height: 40px; flex: 1; }

  /* Resolve banner */
  .resolve-banner {
    background: linear-gradient(135deg, var(--jade-light), #d1fae5);
    border: 1.5px solid rgba(16,185,129,0.3);
    border-radius: var(--r-xl);
    padding: 1.4rem 1.6rem;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    flex-wrap: wrap;
  }
  .resolve-banner p { font-size: 0.9rem; color: var(--jade-dark); margin: 0; }

  .resolved-banner {
    background: var(--jade-light); border: 1.5px solid rgba(16,185,129,0.4);
    border-radius: var(--r-xl); padding: 1.2rem 1.5rem;
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; color: var(--jade-dark); margin-bottom: 1.2rem;
  }
</style>
</head>
<body>

<nav class="navbar" id="navbar">
  <a class="navbar-brand" href="/home.html">
    <div class="logo-mark">🔍</div>
    NIE-Vault
  </a>
  <div class="navbar-nav">
    <a class="nav-item" href="/home.html">Home</a>
    <a class="nav-item" href="/search.html">Browse Items</a>
  </div>
  <div class="navbar-actions">
    <span style="font-size:0.85rem;color:var(--ink-40);">Hi, <strong id="nav-user">…</strong></span>
    <button class="btn btn-ghost btn-sm" id="nav-logout">Sign Out</button>
  </div>
</nav>

<main id="main">
  <div class="empty-state"><div class="spinner" style="width:32px;height:32px;border-color:var(--border-md);border-top-color:var(--sky);"></div></div>
</main>

<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="js/app.js"></script>
<script src="js/notifications.js"></script>
<script src="js/item.js"></script>
</body>
</html>
